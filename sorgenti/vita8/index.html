<title>Gioco della Vita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: la città riempie lo schermo; sopra galleggiano la scheda del personaggio, i comandi e i pannelli che salgono dal basso.
   Un solo aspetto (città di giorno), con colori espliciti. */
:root{
  --ink:#1f2540; --soft:#5d6585; --card:#fffdf7; --line:#e3dccb; --chip:#f3efe4;
  --accent:#ff6a3d; --accent-ink:#ffffff; --sun:#ffc23d; --teal:#0f9e8a; --sky:#cfe9f7;
  --fel:#f5a700; --sal:#e5484d; --int:#3b6fe0; --sim:#9b5de5; --spo:#16a34a;
  --good:#15803d; --bad:#c2410c;
  --f-disp:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#8ccf72;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{-webkit-user-select:text;user-select:text}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* scheda personaggio in alto */
.hud{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.me{pointer-events:auto;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px 12px 8px 8px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(31,37,64,.25);min-width:0;max-width:330px;flex:1 1 auto}
.me .av{width:46px;height:46px;border-radius:50%;background:#eaf6ff;border:2px solid var(--sun);flex:none}
.ib{position:relative}.badge{position:absolute;right:-6px;bottom:-6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.big2{font-family:var(--f-disp);font-size:20px;white-space:nowrap}.prog.big{height:12px;margin:6px 0}
.prog{height:8px;border-radius:9px;background:#e9e3d3;margin-top:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--spo);border-radius:9px}
.seg.wrap{flex-wrap:wrap}.seg .sw{flex:0 0 auto;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:14px}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(31,37,64,.3)}
.me .nm{min-width:0;flex:1}
.me .nm b{font-family:var(--f-disp);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.me .nm span{font-size:13px;color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .age{font-family:var(--f-disp);font-weight:800;color:var(--accent);font-size:34px;line-height:.8;text-align:center;flex:none}
.me .age small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.me .nm .minis{display:flex;gap:3px;margin-top:4px;overflow:visible}
.minis i{flex:1;height:6px;border-radius:9px;background:#e9e3d3;position:relative;overflow:hidden}
.minis i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c);border-radius:9px}
.side{pointer-events:auto;display:grid;gap:6px;flex:none}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(31,37,64,.25);white-space:nowrap;text-align:center;font-size:15px}
.pill.neg{color:var(--bad)}
.iconbtns{display:flex;gap:6px;justify-content:flex-end}
.ib{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-size:22px;box-shadow:0 3px 0 rgba(31,37,64,.25);display:grid;place-items:center;padding:0}
.ib[aria-pressed="true"]{background:var(--sun)}

.tip{position:fixed;z-index:4;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));max-width:min(420px,calc(100% - 32px));
  background:rgba(31,37,64,.85);color:#fff;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:700;text-align:center;pointer-events:none}

/* comandi in basso */
.pad{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:2px;touch-action:none;background:rgba(255,253,247,.35);border-radius:50%;padding:6px}
.pad button{pointer-events:none;border:2px solid var(--ink);background:rgba(255,253,247,.9);border-radius:14px;font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(31,37,64,.25);padding:0;touch-action:none}
.pad button.on{background:var(--sun);transform:translateY(2px);box-shadow:none}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.actbtn{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));min-width:110px;height:76px;border-radius:24px;border:3px solid var(--ink);
  background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:22px;font-weight:800;padding:0 16px;box-shadow:0 5px 0 var(--ink);line-height:1.05}
.actbtn small{display:block;font-size:13px;font-weight:700;opacity:.95}
.actbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* pannelli che salgono dal basso */
.sheet{position:fixed;z-index:10;left:0;right:0;bottom:0;max-height:min(78%,640px);display:flex;flex-direction:column;background:var(--card);border-top:3px solid var(--ink);border-radius:24px 24px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .hd .big{font-size:36px;line-height:1}
.sheet .hd h2{font-size:24px;flex:1;min-width:0}
.sheet .hd .sub{display:block;font-family:var(--f-body);font-size:13px;color:var(--soft);font-weight:400}
.x{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:18px;font-weight:800;flex:none}
.sheet .bd{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sheet .wrapw{max-width:640px;margin:0 auto;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{display:block}
.row .t span{font-size:13px;color:var(--soft)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:var(--ink);color:#fff;white-space:nowrap}
.btn.alt{background:var(--chip);color:var(--ink);border:2px solid var(--line)}
.btn.hot{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.en{display:inline-block;font-size:12px;font-weight:700;color:#8a5a00;background:#fff1cc;border-radius:99px;padding:0 7px;margin-left:4px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--chip);font-size:12px;font-weight:700;margin:3px 4px 0 0}
.tag.ok{color:var(--good)} .tag.no{color:var(--bad)}
.note{padding:10px 14px;border-radius:14px;background:var(--chip);font-size:15px;margin:8px 0}
.h3{font-family:var(--f-disp);font-size:19px;margin:14px 0 2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{display:grid;grid-template-columns:105px 1fr 34px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin:6px 0}
.bar{height:12px;border-radius:99px;background:#e9e3d3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.stat em{font-style:normal;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.year{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.year .y{font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--teal);text-align:right}
.year ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;min-width:0;font-size:15px}
.year li{overflow-wrap:anywhere}

/* chiacchierata */
.chat .bd{display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;font-size:16px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.msg.them{background:var(--chip);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--int);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg.sep{align-self:center;color:var(--soft);font-size:12px;padding:0;background:transparent}
.chatlog{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.msg.fx{align-self:center;background:transparent;color:var(--good);font-size:13px;font-weight:700;padding:0}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.quick button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
.say{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.say input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.hearts{font-size:13px;color:var(--sal);letter-spacing:1px}

/* finestra imprevisti */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,12,25,.55);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--card);border-radius:22px;padding:20px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);}
@keyframes pop{from{transform:scale(.92);opacity:.5}to{transform:none;opacity:1}}
.modal .big{font-size:48px;line-height:1}
.modal h2{font-size:26px;margin:6px 0 8px}
.modal p{margin:0 0 14px}
.choices{display:grid;gap:8px}
.choices button{border:2px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700}
.choices button:hover{border-color:var(--accent)}
.choices .go{text-align:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{padding:3px 10px;border-radius:99px;font-size:14px;font-weight:700;background:var(--chip)}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(140px + env(safe-area-inset-top,0px));max-width:min(440px,calc(100% - 32px));
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center;pointer-events:none}

/* inizio e fine */
.screen{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(#cfe9f7,#eaf6ff 40%,#8ccf72 40%,#7cc364);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen .in{max-width:480px;margin:0 auto;display:grid;gap:14px}
.screen h1{font-size:46px;font-weight:800;color:var(--accent);text-shadow:0 3px 0 #fff}
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 4px 0 rgba(31,37,64,.25)}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field input,.field select{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:#ffe7de}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--chip);border-radius:12px;padding:10px}
.summary b{display:block;font-family:var(--f-disp);font-size:18px}
.summary span{font-size:13px;color:var(--soft)}
#minimap{width:100%;height:auto;border-radius:14px;border:2px solid var(--ink);display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:380px){.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}.actbtn{min-width:96px;height:68px;font-size:19px}.me .age{font-size:28px}}
</style>

<canvas id="world" aria-label="La città: muovi il personaggio con le frecce o toccando la mappa"></canvas>

<div class="hud" id="hud" hidden>
  <button class="me" id="meBtn" type="button" aria-label="Apri la tua scheda">
    <canvas class="av" id="hAv" width="92" height="92"></canvas>
    <span class="nm"><b id="hName">Pietro</b><span id="hStage">Neonato</span><span class="minis" id="hMinis"></span></span>
    <span class="age" id="hAge">0<small>anni</small></span>
  </button>
  <div class="side">
    <div class="pill" id="hMoney">0 €</div>
    <div class="pill" id="hBank" title="Conto in banca" hidden>🏦 0 €</div>
    <div class="iconbtns"><button class="ib" id="rideBtn" type="button" aria-label="Usa il tuo mezzo" hidden>🚲</button><button class="ib" id="goalBtn" type="button" aria-label="Missioni e obiettivi">🎯</button><button class="ib" id="mapBtn" type="button" aria-label="Mappa della città">🗺️</button></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<button class="actbtn" id="actBtn" type="button" hidden>Entra</button>

<div class="sheet" id="sheet" hidden></div>
<div class="sheet chat" id="chat" hidden></div>
<div class="veil" id="veil" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="screen" id="screen" hidden></div>

<script>
/* ================= utilità ================= */
const LS='gioco-della-vita-citta-v7', LS_OLD='gioco-della-vita-citta-v6';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
let S=null;
const ui={sheet:null,ioTab:'stat',chatNpc:null,chat:[],result:null,confirmReset:false,sex:'m',name:'Pietro',city:'Milano'};
const o=()=>S.sex==='f'?'a':'o';
const g=(m,f)=>S.sex==='f'?f:m;
function add(k,d){S.st[k]=clamp(S.st[k]+d)}
function wealth(){return S.money+(S.bank||0)}
function hasCard(){return S.bank!=null&&S.age>=14}
function canPay(x){if(S&&parCovers(x))return true;return S.money+(hasCard()?Math.max(0,S.bank):0)>=x}
// spese a mano: prima i contanti, poi la carta (se ce l'hai)
function money(d){d=Math.round(d);if(d<0&&parCovers(-d)){if(-d>PP_SMALL)S.done.wishBig=1;ui.parPaid=(ui.parPaid||0)-d;ui.parPayer=parNear();return}if(d>=0){S.money+=d;return}let need=-d;const c=Math.min(Math.max(S.money,0),need);S.money-=c;need-=c;if(need>0&&hasCard()){const b=Math.min(Math.max(S.bank,0),need);S.bank-=b;need-=b}if(need>0)S.money-=need}
// spese automatiche (affitto, bollette): prima dal conto
function bills(d){let need=Math.round(d);if(S.bank!=null){const b=Math.min(Math.max(S.bank,0),need);S.bank-=b;need-=b}const c=Math.min(Math.max(S.money,0),need);S.money-=c;need-=c;if(need>0){if(S.bank!=null)S.bank-=need;else S.money-=need}}
// stipendio e pensione: sul conto, se ce l'hai
function income(d){d=Math.round(d);if(S.bank!=null)S.bank+=d;else S.money+=d}
function log(t){let y=S.log.find(x=>x.age===S.age);if(!y){y={age:S.age,t:[]};S.log.push(y)}y.t.push(t)}
function once(k){if(S.done[k])return false;S.done[k]=true;return true}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
let tt=null;
function toast(m){if(ui.parPaid){m+=` (paga ${parName(ui.parPayer||'mamma')} 💕)`;ui.parPaid=0}const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600)}

const NOMI_M=['Luca','Marco','Matteo','Andrea','Paolo','Francesco','Davide','Simone','Lorenzo','Tommaso','Riccardo','Alessandro','Gabriele','Edoardo','Leonardo'];
const NOMI_F=['Giulia','Sofia','Aurora','Alice','Emma','Chiara','Sara','Martina','Elena','Anna','Beatrice','Greta','Ludovica','Irene','Camilla'];
const CITTA=['Milano','Roma','Napoli','Torino','Bologna','Firenze','Genova','Bari','Palermo','Verona','Padova','Trieste','Cagliari','Perugia','Ancona','Trento','Lecce','Bergamo'];
const STATS=[['fel','Felicità','#f5a700'],['sal','Salute','#e5484d'],['int','Intelligenza','#3b6fe0'],['sim','Simpatia','#9b5de5'],['spo','Sport','#16a34a']];
const SCUOLE={asilo:{n:'Asilo',d:3},elementari:{n:'Scuola elementare',d:5},medie:{n:'Scuola media',d:3},
  liceo:{n:'Liceo',d:5},tecnico:{n:'Istituto tecnico',d:5},professionale:{n:'Istituto professionale',d:5}};
const FAC={informatica:{n:'Informatica',d:3},motorie:{n:'Scienze motorie',d:3},infermieristica:{n:'Infermieristica',d:3},
  economia:{n:'Economia',d:5},lettere:{n:'Lettere',d:5},giurisprudenza:{n:'Giurisprudenza',d:5},
  ingegneria:{n:'Ingegneria',d:5},veterinaria:{n:'Veterinaria',d:5},medicina:{n:'Medicina',d:6}};
const EDU=['Nessuno','Licenza media','Diploma','Laurea'];
const EN_MAX=12;

/* ================= lavori, negozio, case ================= */
const dipl=(...t)=>s=>s.edu>=2&&t.includes(s.diploma);
const lau=(...f)=>s=>s.edu>=3&&f.includes(s.laurea);
const JOBS=[
 {id:'cameriere',m:'Cameriere',f:'Cameriera',sal:15000,min:16,req:s=>s.edu>=1,rt:'Licenza media'},
 {id:'commesso',m:'Commesso',f:'Commessa',sal:16500,min:16,req:s=>s.edu>=1,rt:'Licenza media'},
 {id:'pizzaiolo',m:'Pizzaiolo',f:'Pizzaiola',sal:18000,min:16,req:s=>s.edu>=1,rt:'Licenza media'},
 {id:'cuoco',m:'Cuoco',f:'Cuoca',sal:22000,min:18,req:dipl('professionale'),rt:'Diploma professionale'},
 {id:'meccanico',m:'Meccanico',f:'Meccanica',sal:23000,min:18,req:dipl('tecnico','professionale'),rt:'Diploma tecnico o professionale'},

let NPCS=[];
function syncNpcs(){
  const L=npcList();
  NPCS=L.map(n=>{const old=NPCS.find(x=>x.id===n.id);
    if(old&&(n.walker||(S.escort&&S.escort.id===n.id)))return Object.assign(n,{x:old.x,y:old.y,scene:old.scene,path:old.path,hide:old.hide,tx:old.tx,ty:null,dir:old.dir,ph:old.ph||0,wait:0});
    const same=old&&old.scene===n.scene;
    return Object.assign(n,{x:same?old.x:n.hx+.5,y:same?old.y:n.hy+.5,tx:null,ty:null,wait:same?old.wait:Math.random()*3,dir:same?old.dir:'d',ph:0})});
}
const sceneNpcs=()=>NPCS.filter(n=>n.scene===S.scene&&!n.inCar);
function npcTick(dt){
  CLK+=dt;trafficTick(dt);NPCS.forEach(n=>{if(n.walker)walkerTick(n,dt)});escortTick(dt);
  sceneNpcs().forEach(n=>{
    if(n.walker||(S.escort&&S.escort.id===n.id))return;
    if(n.path&&n.path.length&&ui.chatNpc!==n.id){const [px,py]=n.path[0],dx=px+.5-n.x,dy=py+.5-n.y,d=Math.hypot(dx,dy),sp=1.5*dt;n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d');n.ph+=dt*10;n.tx=1;
      if(d<=sp){n.x=px+.5;n.y=py+.5;n.path.shift();if(!n.path.length){n.tx=null;n.path=null;if(n.leave)sendHome(n)}}else{n.x+=dx/d*sp;n.y+=dy/d*sp}return}
    if(n.leave){sendHome(n);return}
    {const sc0=SC[n.scene];if(sc0&&sc0.t&&n.hx!=null&&Math.hypot(n.x-(n.hx+.5),n.y-(n.hy+.5))>2.6){n.pt=(n.pt||0)-dt;if(n.pt<=0){n.pt=3;n.path=bfsIn(sc0,Math.floor(n.x),Math.floor(n.y),n.hx,n.hy)}if(n.path&&n.path.length)return}}
    if(ui.chatNpc===n.id){const dx=S.pos.x-n.x,dy=S.pos.y-n.y;n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d');return}
    const sc=SC[n.scene],fixed=['educatrice','gelataio','bancario','agente','commessa','cassiere','cassiera','pizzaiolo','bibliotecaria'].includes(n.role);
    if(n.tx==null){n.wait-=dt;if(n.wait<=0){const rad=fixed?.8:(n.roam||2);const tx=n.hx+.5+(Math.random()*2-1)*rad,ty=n.hy+.5+(fixed?0:(Math.random()*2-1)*rad);if(freeIn(sc,tx,ty)){n.tx=tx;n.ty=ty}n.wait=2+Math.random()*4}return}
    const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy),sp=(n.animal?1.6:0.9)*dt;
    if(d<.05){n.tx=null;return}
    n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d');n.ph+=dt*10;
    const nx=n.x+dx/d*Math.min(sp,d),ny=n.y+dy/d*Math.min(sp,d);
    if(freeIn(sc,nx,ny)&&Math.hypot(nx-S.pos.x,ny-S.pos.y)>.5){n.x=nx;n.y=ny}else n.tx=null;
  });
}

const CAR_COL=['#8c2f2f','#2f3b5c','#d9d5cc','#3e3e42','#6b7a8a','#4f6b45','#c9a96e','#f1ece2','#1f2540'];
const TRAF=[];
(function(){const r=seeded(5);
  RY.forEach(ry=>[1,-1].forEach(d=>{for(let i=0;i<2;i++)TRAF.push({o:'h',road:ry,d,p:3+r()*(W-6),v:2+r()*1.2,col:CAR_COL[Math.floor(r()*CAR_COL.length)]})}));
  RX.forEach(rx=>[1,-1].forEach(d=>{for(let i=0;i<2;i++)TRAF.push({o:'v',road:rx,d,p:3+r()*(H-6),v:2+r()*1.2,col:CAR_COL[Math.floor(r()*CAR_COL.length)]})}));
})();
const carXY=c=>c.o==='h'?[c.p,(c.d>0?c.road+1:c.road)+.5]:[(c.d>0?c.road:c.road+1)+.5,c.p];
const inBox=(x,y)=>RX.some(c=>x>=c-.2&&x<c+2.2)&&RY.some(r=>y>=r-.2&&y<r+2.2);
function nextBoxDist(o,d,x,y){const L=o==='h'?RX:RY,p=o==='h'?x:y;let best=null;for(const c of L){const e=d>0?c-.2:c+2.2,dist=(e-p)*d;if(dist>0&&(!best||dist<best.d))best={d:dist,c}}return best}
function trafficTick(dt){
  const obs=[];if(S&&S.scene==='citta')obs.push([S.pos.x,S.pos.y]);
  NPCS.forEach(n=>{if(n.scene==='citta'&&!n.inCar)obs.push([n.x,n.y])});
  const pos=TRAF.map(carXY);
  TRAF.forEach((c,i)=>{
    const [x,y]=pos[i],h=c.o==='h';let stop=false;
    const ahead=(ox,oy,len,wid)=>{const al=h?(ox-x)*c.d:(oy-y)*c.d,pe=h?Math.abs(oy-y):Math.abs(ox-x);return al>0&&al<len&&pe<wid};
    for(const [ox,oy] of obs)if(ahead(ox,oy,1.7,.75)){stop=true;break}
    if(!stop)for(let j=0;j<TRAF.length;j++){if(j===i)continue;const [ox,oy]=pos[j];if(TRAF[j].o===c.o&&ahead(ox,oy,2.3,.4)){stop=true;break}}
    if(!stop){const nx=h?x+c.d*1.3:x,ny=h?y:y+c.d*1.3;
      if(!inBox(x,y)&&inBox(nx,ny))for(let j=0;j<TRAF.length;j++){const o=TRAF[j];if(o.o===c.o)continue;const [ox,oy]=pos[j];if(inBox(ox,oy)&&Math.hypot(ox-nx,oy-ny)<2.6){stop=true;break}}}
    if(!stop){const nb=nextBoxDist(c.o,c.d,x,y);if(nb&&nb.d>1.3&&nb.d<2.6&&lightAt(h?nb.c+1:x,h?y:nb.c+1,c.o)!=='g')stop=true}
    c.stop=stop;
    if(!stop){c.p+=c.d*c.v*dt;const lim=h?W:H;if(c.p>lim-1.5)c.p=1.5;if(c.p<1.5)c.p=lim-1.5}
  });
}

  const L=T*({city:1.5,wagon:1.78,suv:1.78,van:1.92,cabrio:1.66,sport:1.72}[sh]||1.7),Wc={suv:27,van:27,sport:23}[sh]||24;
  c.fillStyle='rgba(0,0,0,.25)';rr(c,-L/2+3,-Wc/2+4,L,Wc,7);c.fill();
  c.fillStyle=col;rr(c,-L/2,-Wc/2,L,Wc,sh==='van'?5:7);c.fill();
  if(sh==='cabrio'){c.fillStyle='#3a3530';rr(c,-L*.22,-Wc/2+4,L*.4,Wc-8,4);c.fill();c.fillStyle='#8a6a4f';c.fillRect(-L*.14,-Wc/2+5,6,Wc/2-6);c.fillRect(-L*.14,1,6,Wc/2-6);c.fillRect(L*.02,-Wc/2+5,6,Wc/2-6);c.fillRect(L*.02,1,6,Wc/2-6);
    c.fillStyle='#3d4a55';rr(c,L*.18,-Wc/2+4,L*.05,Wc-8,1);c.fill()}
  else{const r0=sh==='van'?.1:sh==='wagon'?.16:.28,rw=sh==='van'?.7:sh==='wagon'?.6:sh==='city'?.5:.46;
    c.fillStyle=shade(col,.8);rr(c,-L/2+L*r0,-Wc/2+3,L*rw,Wc-6,4);c.fill();
    c.fillStyle='#3d4a55';rr(c,-L/2+L*(r0+rw)-L*.1,-Wc/2+4,L*.1,Wc-8,2);c.fill();rr(c,-L/2+L*r0,-Wc/2+4,L*.08,Wc-8,2);c.fill();
    if(sh==='suv'){c.fillStyle='rgba(30,30,30,.45)';c.fillRect(-L/2+L*r0+6,-Wc/2+5,L*rw-24,2);c.fillRect(-L/2+L*r0+6,Wc/2-7,L*rw-24,2)}}
  if(sh==='sport'){c.fillStyle='rgba(255,255,255,.85)';c.fillRect(-L/2+2,-3,L-4,2);c.fillRect(-L/2+2,1,L-4,2)}
  c.fillStyle='#efe6c0';c.fillRect(L/2-3,-Wc/2+3,2,4);c.fillRect(L/2-3,Wc/2-7,2,4);
  c.fillStyle=stop?'#ff3b30':'#8c2f2f';c.fillRect(-L/2+1,-Wc/2+3,2.5,4);c.fillRect(-L/2+1,Wc/2-7,2.5,4);
  c.restore();
}

function spawnLoot(more){
  if(!more)S.loot=[];const goal=S.loot.length+10;let coins=more?2:4;
  const ids=Object.keys(LOOT),bag=[];ids.forEach(k=>{for(let i=0;i<LOOT[k].w;i++)bag.push(k)});
  let tries=0;
  while(S.loot.length<goal&&tries++<500){
    const x=R(1,W-2),y=R(1,H-2),v=at(x,y);
    if(v!==0&&v!==2&&v!==7&&v!==6)continue;
    S.loot.push({k:coins-->0?'moneta':pick(bag),x:x+.5,y:y+.5});
  }

const MISS_N=10, MISS_CAP={cultura:3,scuola:3,soldi:3,sport:2,amici:3,casa:3,lavoro:2,esplora:1,salute:1};
const missOK=k=>{const M=MISS[k];return S.age>=M.a[0]&&S.age<=M.a[1]&&(!M.ok||M.ok())};
function premio(){return S.age<10?R(2,5):S.age<14?R(5,10):S.age<18?R(10,20):S.age<65?R(50,150):R(30,80)}
function newMissions(){
  const prev=S.prevMiss||[];
  S.cnt={};S.seenYr={};S.visitYr={};S.rerolls=3;S.yearReady=false;
  const ids=Object.keys(MISS).filter(missOK).sort(()=>Math.random()-.5).sort((a,b)=>prev.includes(a)-prev.includes(b));
  const out=[],cc={},take=k=>{out.push(k);cc[MISS[k].c]=(cc[MISS[k].c]||0)+1};
  const MIN={cultura:S.age>=3?2:1,scuola:inSchool()?2:0,soldi:S.age>=8?1:0,sport:S.age>=4?1:0};
  for(const c in MIN)for(const k of ids){if((cc[c]||0)>=MIN[c])break;if(MISS[k].c===c&&!out.includes(k))take(k)}
  for(const k of ids){if(out.length>=MISS_N)break;if(!out.includes(k)&&(cc[MISS[k].c]||0)<(MISS_CAP[MISS[k].c]||2))take(k)}
  for(const k of ids){if(out.length>=MISS_N)break;if(!out.includes(k))take(k)}
  S.prevMiss=out.slice();
  S.miss=out.sort(()=>Math.random()-.5).map(k=>({k,t:MISS[k].t(),p:premio(),ok:false}));
}
function reroll(i){
  const m=S.miss[i];if(!m||m.ok||S.rerolls<=0)return;
  const used=S.miss.map(x=>x.k);const ids=Object.keys(MISS).filter(k=>!used.includes(k)&&missOK(k));
  if(!ids.length)return toast('Non ci sono altri obiettivi disponibili.');
  const k=pick(ids);S.miss[i]={k,t:MISS[k].t(),p:premio(),ok:false};S.rerolls--;save();updateHud();refreshSheet();
}
function missProg(m){const M=MISS[m.k];if(!M)return 0;if(M.p)return M.p();return m.k==='parla'?Object.keys(S.seenYr||{}).length:m.k==='entra'?Object.keys(S.visitYr||{}).length:(S.cnt[m.k]||0)}

function checkGoals(){
  if(!S||!S.alive)return;
  const won=[];
  S.miss.forEach(m=>{if(!m.ok&&MISS[m.k]&&missProg(m)>=m.t){m.ok=true;money(m.p);add('fel',2);won.push(`✅ ${MISS[m.k].n(m.t)}! +${eur(m.p)}`)}});
  GOALS.forEach(gl=>{if(S.goals[gl.id]==null&&gl.ok()){S.goals[gl.id]=S.age;money(gl.p);add('fel',4);won.push(`🏆 Obiettivo: ${gl.n}! +${eur(gl.p)}`)}});
  if(won.length){won.forEach(w=>log(w));toast(won.length>2?`✅ Hai completato ${won.length} obiettivi!`:won.join('  ·  '));save()}
  if(!S.yearReady&&S.miss.length&&S.miss.every(m=>m.ok)){S.yearReady=true;save();setTimeout(()=>{$('toast').hidden=true;renderModal()},900)}
}

function ageUp(){
  if(!S||!S.alive||S.pending)return;
  if(S.items.some(i=>i.veh)&&!S.revOK&&S.age>=15&&chance(.6)){bills(173);S.multe=(S.multe||0)+1;log('Controllo stradale: la revisione del tuo mezzo era scaduta. Multa di 173 €. 👮')}
  S.age++; S.done={}; S.relYr={}; S.energy=EN_MAX; S.revOK=false; S.carOut=false; S.drive=null;
  if(S.age===1)log('Hai compiuto il tuo primo compleanno! 🎂');
  schoolYear(); uniYear(); economy(); aging(); milestones(); parentGifts();
  S.studied=false; S.slacked=false; S.voti=[]; S.compiti=false; S.zaino=false; S.escort=null;
  S.felSum+=S.st.fel; S.years++;
  S.scene='casa';S.pos={x:3.5,y:5.5};S.face='d'; S.ride=false;
  if(checkEnd()){save();showEnd();return}
  pickParLoc(); newMissions(); spawnLoot(); syncNpcs();
  if(!S.pending)maybeEvent();
  save();
  toast(`Buongiorno! 🌞 Ora hai ${S.age} ${S.age===1?'anno':'anni'}.`);
}
function parentGifts(){
  if(S.home!=='genitori')return;
  if(S.age===3){S.inv.push('pupazzo');log('Per il tuo compleanno la nonna ti regala un orsacchiotto! 🧸')}
  if(S.age===6){const a=giveItem('bici'),b=giveItem('casco');if(a||b)log('Per i tuoi 6 anni mamma e papà ti regalano la bicicletta e il casco! 🚲⛑️')}
  if(S.age===11&&giveItem('telefono'))log('Per gli 11 anni mamma e papà ti regalano il tuo primo telefono! 📱 Ma a tavola si spegne!');
}
function voto(){
  let v=4+S.st.int/20+(S.studied?1.3:0)+(S.zaino?.3:0)-(S.slacked?1.2:0)+(Math.random()*1.6-.8)-(S.job?0.5:0);
  if(S.voti&&S.voti.length)v=(v+S.voti.reduce((a,b)=>a+b,0)/S.voti.length)/2;
  return Math.max(3,Math.min(10,Math.round(v)));
}
function schoolYear(){
  if(!S.school){ if(S.age===3){S.school={tipo:'asilo',anno:1};log('Primo giorno di asilo! Hai un grembiulino nuovo. 🎒')} return }
  const sc=S.school, d=SCUOLE[sc.tipo].d;
  if(sc.tipo==='asilo'){
    sc.anno++;
    if(sc.anno>d){S.school={tipo:'elementari',anno:1};log('Inizi la scuola elementare! Impari a leggere e a scrivere. ✏️')}
    return;
  }
  const v=voto(); S.lastVoto=v; S.bestVoto=Math.max(S.bestVoto||0,v);
  const nome=SCUOLE[sc.tipo].n;
  if(v<6&&sc.tipo!=='elementari'&&!(sc.anno===d)){
    if(v<5){S.bocciature++;add('fel',-10);log(`Pagella: media ${v}. Purtroppo sei stat${o()} bocciat${o()} e ripeti la ${sc.anno}ª. Quest'anno vai a scuola a studiare! 📚`);return}
    log(`Pagella: media ${v}. Promoss${o()} per un pelo!`);
  }else if(sc.anno<d){
    log(`Pagella della ${sc.anno}ª ${nome.toLowerCase()}: media ${v}${v>=9?' 🌟 Bravissim'+o()+'!':v>=7?' 👍':''}`);
    if(v>=9)add('fel',4);
  }
  if(sc.anno<d){sc.anno++;return}
  if(sc.tipo==='elementari'){S.school={tipo:'medie',anno:1};log(`Fine delle elementari (media ${v}). Si passa alle medie! 🏫`);return}
  if(sc.tipo==='medie'){
    if(v<5){S.bocciature++;add('fel',-10);log(`Esame di terza media non superato (voto ${v}). Ripeti la terza.`);return}
    S.edu=1;S.school=null;log(`Esame di terza media superato con ${v>=10?'10 e lode':Math.max(6,v)}! 🎓`);add('fel',6);
    S.pending='scelta_superiori';return;
  }
  if(v<5){S.bocciature++;add('fel',-10);log(`Maturità non superata, la riproverai l'anno prossimo.`);return}
  const mat=Math.max(60,Math.min(100,Math.round(60+(v-5)*8+R(-4,4))));
  S.edu=2;S.diploma=sc.tipo;S.school=null;
  log(`Maturità superata con ${mat}/100${mat===100?' e lode':''}! Ora hai il diploma. 🎓`);add('fel',10);
  S.pending='dopo_diploma';
}
function uniYear(){
  if(!S.uni)return;
  const u=S.uni;
  let p=0.3+S.st.int/160+(S.studied?0.3:0)-(S.slacked?0.25:0)-(S.job?0.2:0);
  if(chance(Math.min(0.96,p))){u.anno++;log(`Esami dell'anno superati! Sei al ${Math.min(u.anno,FAC[u.fac].d)}° anno di ${FAC[u.fac].n}.`)}
  else{u.fc++;add('fel',-4);log(`Quest'anno qualche esame è andato male: sei fuori corso. Vai all'università a studiare!`)}
  if(u.anno>FAC[u.fac].d){
    const v=Math.max(66,Math.min(110,Math.round(70+S.st.int*0.35+R(-4,4)-u.fc*3)));
    S.edu=3;S.laurea=u.fac;S.uni=null;add('fel',12);
    log(`Laurea in ${FAC[u.fac].n} con ${v}/110${v===110?' e lode':''}! 🎓🌿 Ora cerca lavoro negli uffici.`);
  }
}
function economy(){
  const parts=[];
  if(!S.job&&!S.retired){
    let p=0; if(S.age>=6&&S.age<=10)p=120; else if(S.age>10&&S.age<=13)p=240; else if(S.age>=14&&S.age<=18)p=480;
    if(p){money(p);parts.push(`paghetta +${eur(p)}`)}
    if(S.uni&&S.home==='genitori'){income(1200);parts.push(`aiuto dei genitori +${eur(1200)}`)}
  }
  if(S.job){income(S.job.sal);S.yearsWorked++;S.job.anni++;parts.push(`stipendio +${eur(S.job.sal)}`)}
  if(S.retired){income(S.pension);parts.push(`pensione +${eur(S.pension)}`)}
  let cost=0;
  if(S.home!=='genitori'){cost+=VIVERE;if(S.home==='affitto')cost+=AFFITTO}
  else if(S.job||S.retired)cost+=Math.round(VIVERE/2);
  if(S.job)cost+=Math.round(S.job.sal*0.25);
  if(S.house&&S.house.mutuo>0){cost+=S.house.rata;S.house.mutuo--;if(S.house.mutuo===0)log('Hai finito di pagare il mutuo: la casa è tutta tua! 🔑')}
  cost+=S.items.reduce((a,i)=>a+(i.up||0),0);
  cost+=S.pets.length*400;
  cost+=S.kids.filter(k=>S.age-k.nato<22).length*3000;
  if(cost){bills(cost);parts.push(`spese −${eur(cost)}`)}
  if(S.bank>0){const i=Math.round(S.bank*0.005);if(i>=1){S.bank+=i;parts.push(`interessi +${eur(i)}`)}}
  if(parts.length&&S.age>=6)log('Soldi dell\'anno: '+parts.join(', ')+'.');
  if(wealth()<0){add('fel',-6);log(`Attenzione: sei in rosso di ${eur(-wealth())}! Spendi di meno o trova un lavoro che paghi di più. 😟`)}
  if(S.job&&S.job.id==='calciatore'&&S.age>=36){log('Hai appeso le scarpette al chiodo: fine della carriera da professionista! ⚽');S.job=null}
  if(S.job&&S.age>=67)retire(true);
  if(S.partner&&!S.married)S.partner.anni++;
}
function retire(auto){
  const last=S.job?S.job.sal:0;
  S.pension=S.yearsWorked>=20?Math.round(Math.max(9000,last*0.65)):7000;
  S.job=null;S.retired=true;add('fel',8);
  log(`${auto?'Hai compiuto 67 anni: ':''}Vai in pensione dopo ${S.yearsWorked} anni di lavoro! Pensione: ${eur(S.pension)} all'anno. 🏖️`);
}
function aging(){
  const a=S.age, st=S.st;
  if(a<50){ if(st.sal<75)add('sal',R(1,3)) }
  else if(a<65)add('sal',-R(0,2)+(st.spo>50?1:0));
  else if(a<75)add('sal',-R(1,3)+(st.spo>50?1:0));
  else add('sal',-R(2,5)+(st.spo>40?1:0));
  if(a>30)add('spo',-(a>60?2:1));
  if(a>=6&&a<=22)add('int',R(0,2));
  if(a>75&&chance(.4))add('int',-1);
  if(st.fel>70)add('fel',-R(0,2));else if(st.fel<50)add('fel',R(1,3));
  if(a<70&&st.sal<12)st.sal=12;
}
function milestones(){
  const M={6:'Hai 6 anni: sei grande ormai!',10:'Dieci anni: doppia cifra! 🔟',14:'14 anni: ora puoi prendere il patentino per il motorino.',
    16:'16 anni: puoi prendere la patente A e iniziare a lavorare.',18:`Sei maggiorenne! 🎉 Puoi prendere la patente dell'auto e andare a vivere da sol${o()}.`,
    30:'Trent\'anni! Festa con gli amici. 🥳',40:'Quarant\'anni! 😄',50:'Mezzo secolo di vita! 🎂',60:'Sessant\'anni: tanta esperienza.',
    80:'Ottant\'anni! Che bel traguardo. 🎂',90:'Novant\'anni! Tutta la famiglia è venuta a festeggiarti.',100:'CENTO ANNI! Ti intervista il giornale della città. 📰'};
  if(M[S.age])log(M[S.age]);
}
function checkEnd(){
  if(S.age<70)return false;
  let p=(S.age-68)*0.011+(S.st.sal<30?0.08:0)+(S.st.sal<12?0.25:0);
  if(S.age>=95)p+=0.2; if(S.age>=110)p=1;
  if(!chance(p))return false;
  S.alive=false;S.pending=null;
  log(`Dopo una lunga vita, ${S.name} si è addormentat${o()} serenamente a ${S.age} anni, circondat${o()} dall'affetto di ${S.kids.length?'tutta la sua famiglia':'tanti amici'}. 🌅`);
  return true;
}

function maybeEvent(){
  if(S.age<1||!chance(.6))return;
  const list=Object.values(E).filter(e=>!e.fixed&&S.age>=e.min&&S.age<=e.max&&!(e.once&&S.seen[e.id])&&(!e.cond||e.cond())&&S.lastEv!==e.id);
  if(!list.length)return;
  const e=pick(list); S.pending=e.id; S.lastEv=e.id; if(e.once)S.seen[e.id]=true;
}

function seeOpera(id){
  const O=OPERE[id];if(!O)return;
  const before=snap(),k='op_'+id,first=!S.done[k];
  if(first){S.done[k]=1;S.opere=S.opere||{};S.opere[id]=1;count('opere');count('curiosita');add('int',2);add('fel',1);log(`Al museo hai visto: ${O.n} ${O.ic}`)}
  ui.result={ic:O.ic,title:O.n,text:O.t+(first?'':' (L\'hai già vista quest\'anno.)'),chips:diffs(before)};
  save();updateHud();renderModal();
}
function readShelf(id){
  const Sh=SCAFFALI[id];if(!Sh)return;
  if(S.age<Sh.age){toast(`Sei ancora piccol${o()} per questi libri. Prova l'angolo delle fiabe! 🧸`);return}
  const k='lib_'+id;if(S.done[k]){toast('Hai già letto un libro di questo scaffale quest\'anno. Provane un altro!');return}
  const before=snap();S.done[k]=1;S.libriLetti=S.libriLetti||{};
  const nuovi=Sh.libri.filter(b=>!S.libriLetti[b[0]]),[tit,fact]=pick(nuovi.length?nuovi:Sh.libri);S.libriLetti[tit]=1;
  count('bibleggi');count('curiosita');add('int',S.age<6?1:R(2,4));add('fel',1);
  const m=S.age<4?`La signora Anna ti legge "${tit}".`:S.age<6?`Ascolti la fiaba "${tit}".`:`Hai letto "${tit}".`;log(m+' 📖');
  ui.result={ic:Sh.ic,title:tit,text:m+' '+fact,chips:diffs(before)};save();updateHud();renderModal();
}

const SPESA=[['pane',2],['latte',2],['banana',1],['formaggio',4],['biscotti',3],['succo',2],['pasta',2],['uova',3]];
const USATI=[['Il Piccolo Principe',5],['Harry Potter',8],['Il GGG',6],['Le fiabe italiane',7],['Atlante del mondo',9],['Enciclopedia degli animali',10]];
function compraSpesa(k){
  const it=SPESA.find(x=>x[0]===k);if(!it)return;
  if(S.age<6)return toast('Sei ancora piccol'+o()+': la spesa la fa la mamma! 🛒');
  if(!canPay(it[1]))return toast('Non hai abbastanza soldi. 💸');
  money(-it[1]);S.inv.push(k);count('spesa');save();updateHud();refreshSheet();toast(`Hai comprato: ${LOOT[k].ic} ${LOOT[k].n} (${eur(it[1])}). È nello zaino!`);
}
function compraUsato(i){
  const it=USATI[i];if(!it)return;
  if(!canPay(it[1]))return toast('Non hai abbastanza soldi. 💸');
  money(-it[1]);S.inv.push('libro');count('compralibro');count('compra');add('fel',2);const m=`Hai comprato il libro "${it[0]}" 📕. È nello zaino: usalo per leggerlo!`;log(m);save();updateHud();refreshSheet();toast(m);
}

function moneyTip(){
  if(S.age<14)return 'Metti da parte la paghetta: così un giorno potrai comprarti la bici o il motorino! 🐷';
  if(wealth()<0)return 'Sei in rosso! Vendi qualcosa che non usi o trova un lavoro che paghi di più.';
  if(!S.job&&S.age>=18&&!S.retired)return 'Senza lavoro i soldi finiscono. Passa negli uffici a candidarti!';
  if(wealth()>50000)return 'Hai un bel gruzzolo! Potresti comprare casa all\'agenzia.';
  return 'Ogni anno la banca ti dà lo 0,5% di interessi sui soldi che risparmi.';
}
function doPA(id){
  const a=PA[id]; if(!a||!a.ok()||S.pending)return;
  const key='pa_'+id, once1=!['dormi','gelato','consiglio','iscriviSup','iscriviUni','lasciaUni','lasciaScuola','licenziati','pensione','vaiAffitto','tornaGenitori','vendiCasa','figlio','verifica','bagno'].includes(id);
  if(once1&&S.done[key]){toast('L\'hai già fatto quest\'anno! Torna dopo aver dormito. 🌙');return}
  if(a.en&&!useEn(a.en))return;
  const before=snap(); const r=a.run();
  if(r===null){if(a.en)S.energy+=a.en;toast('Non hai abbastanza soldi. 💸');return}
  if(id==='dormi')return;
  if(S._noMark){delete S._noMark;toast(r);return}
  if(once1)S.done[key]=true;
  const CK={asilo_nanna:'nanna',asilo_pappa:'merenda',bagno:'bagno',denti:'denti',bagnetto:'bagnetto',lettone:'nanna',studia:'studia',sport:'sport',gelato:'gelato',aiuta:'aiuta',merenda:'merenda',lavorasodo:'lavoro',visita:'visita',leggi:'leggi',videogiochi:'tv',pisolino:'nanna',asilo_gioca:'asilo',asilo_disegna:'disegna',asilo_canta:'canta',ricreazione:'ricreazione',volontariato:'volontariato',lavoretto:'lavoretto',compiti:'compiti',zaino:'zaino',verifica:'verifica',nuota:'nuoto',film:'film',teatro:'teatro',pizza:'pizza',cameriere:'lavoretto',prestito:'prestito',partita:'partita'};
  if(CK[id]&&r&&!r.startsWith('Hai già'))count(CK[id]);
  if(id==='pisolino'){S.done[key]=(S.done[key]||0)+1}
  if(r&&!['consiglio'].includes(id)&&!r.startsWith('Hai già'))log(r);
  save(); updateHud(); refreshSheet(); renderModal();
  if(r)toast(r+diffText(before));
}
function snap(){return {st:{...S.st},money:wealth()}}
function diffs(b){const out=[];STATS.forEach(([k,n])=>{const d=S.st[k]-b.st[k];if(d)out.push({t:`${n} ${d>0?'+':''}${d}`,up:d>0})});const m=wealth()-b.money;if(m&&!ui.parPaid)out.push({t:`${m>0?'+':'−'}${eur(Math.abs(m))}`,up:m>0});return out}
function diffText(b){const d=diffs(b);return d.length?'  ('+d.map(x=>x.t).join(', ')+')':''}

function buy(id){
  const it=ALLITEMS.find(x=>x.id===id); if(!it)return;
  if(it.veh&&ui.parPay&&parNear()){ui.parPay=false;refreshSheet();return toast('Moto e macchine i genitori non le regalano: chiedi al papà di fare a metà! 😉')}
  if(!canPay(it.p))return toast('Non hai abbastanza soldi. 💸');
  S.everItems[it.id]=true; count('compra'); money(-it.p); S.items.push({id:it.id,n:it.n,ic:it.ic,p:it.p,up:it.up||0,veh:!!it.veh,speed:it.speed||0});
  add('fel',it.fel||0); if(it.int)add('int',it.int);
  const m=`Hai comprato: ${it.n} ${it.ic}${it.ride?' — usa il bottone in alto per salirci!':''}`; log(`Hai comprato: ${it.n} ${it.ic}`); save(); updateHud(); refreshSheet(); toast(m);
}
function sell(i){
  const it=S.items[i]; if(!it)return; const v=Math.round(it.p*0.5);
  money(v); S.items.splice(i,1); if(!bestRide())S.ride=false; const m=`Hai venduto ${it.n} per ${eur(v)}.`; log(m); save(); updateHud(); refreshSheet(); toast(m);
}
function licenza(k){
  const L=LIC[k]; if(S.done['lic_'+k]||S.age<L.age)return;
  if(!canPay(L.p))return toast('Non hai abbastanza soldi per l\'esame. 💸');
  if(!useEn(2))return;
  money(-L.p); S.done['lic_'+k]=true;
  const ok=chance(Math.min(.92,.45+S.st.int/200+(S.flags['try_'+k]||0)*.1));
  let m; if(ok){S.lic[k]=true;add('fel',8);m=`Esame superato! Ora hai la ${L.n}. 🪪`}
  else{S.flags['try_'+k]=(S.flags['try_'+k]||0)+1;add('fel',-3);m=`Esame della ${L.n} non superato. Riprova l'anno prossimo!`}
  log(m); save(); updateHud(); refreshSheet(); toast(m);
}
function compraCasa(id,mutuo){
  const c=CASE.find(x=>x.id===id); if(!c||S.house)return;
  const need=mutuo?Math.round(c.p*0.2):c.p;
  if(!canPay(need))return toast('Non hai abbastanza soldi. 💸');
  if(mutuo&&!S.job)return toast('Per il mutuo la banca vuole che tu abbia un lavoro.');
  money(-need); S.house={id:c.id,n:c.n,ic:c.ic,p:c.p,mutuo:mutuo?MUTUO_ANNI:0,rata:mutuo?rata(c.p):0};
  S.home='casa'; S.flags.hadHouse=true; add('fel',c.fel);
  const m=mutuo?`Hai comprato: ${c.n} ${c.ic} con un mutuo! ${eur(S.house.rata)} all'anno per ${MUTUO_ANNI} anni.`:`Hai comprato: ${c.n} ${c.ic}!`;
  log(m); save(); updateHud(); refreshSheet(); toast(m);
}
function candidati(id){
  const j=JOBS.find(x=>x.id===id); if(!j||S.done['job_'+id])return;
  if(!useEn(1))return;
  S.done['job_'+id]=true; count('candidati');
  const p=j.hard?0.3:j.star?0.65:Math.min(0.92,0.55+(S.st.sim-50)/200+(S.st.int-50)/300);
  let m;
  if(chance(p)){
    if(S.job)log(`Hai lasciato il lavoro da ${jobName(S.job).toLowerCase()}.`);
    S.job={id:j.id,m:j.m,f:j.f,sal:j.sal,anni:0};add('fel',10);
    m=`Ti hanno assunt${o()}! Ora fai ${g('il','la')} ${jobName(j).toLowerCase()}: ${eur(j.sal)} all'anno. 🎉`;
  }else{add('fel',-3);m=`Il colloquio come ${jobName(j).toLowerCase()} non è andato bene. Riprova l'anno prossimo!`}
  log(m); save(); updateHud(); refreshSheet(); toast(m);
}

function paBtn(id){

function choose(i){
  const e=E[S.pending]; if(!e)return; const c=e.choices()[i]; if(!c)return;
